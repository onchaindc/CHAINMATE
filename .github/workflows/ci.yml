name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` is what Vercel runs, so CI must run it too: it fails on a
      # lockfile that has drifted from package.json, which is exactly the
      # class of breakage that should never reach a deploy.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The build is the real gate — it type-checks every route and catches
      # server/client boundary mistakes that tsc alone does not.
      #
      # No secrets are provided on purpose. Every integration in this app is
      # key-gated (Supabase, KV, AI, GenLayer), so a keyless build proves the
      # app compiles and boots in its degraded-but-working default mode.
      - run: npm run build
